name: Testes do frontend

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependências
        run: npm ci

      - name: Instala navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Roda a suíte (smoke, funcional, performance, regressão)
        run: npm test

      - name: Sobe o relatório se algum teste falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/playwright-report/
          retention-days: 14
