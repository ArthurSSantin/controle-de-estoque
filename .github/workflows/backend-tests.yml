name: Testes do backend

on:
  push:
    branches: [master]
    paths:
      - 'supabase/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Edge function contra Supabase falso em memória
        run: node --experimental-strip-types --no-warnings --test supabase/tests/api.test.mjs
